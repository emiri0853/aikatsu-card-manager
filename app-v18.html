<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>アイカツ！カード管理</title><style>:root{--p:#ef78a7;--bg:#fff9fc;--line:#f0dbe4}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Maru Gothic ProN",sans-serif;color:#503c45}header{position:sticky;top:0;z-index:5;background:#fff9fcf2;padding:12px;border-bottom:1px solid var(--line)}h1{margin:0 0 10px;font-size:20px;color:#dc5c8e}.tools{display:flex;gap:7px}.tools input{flex:1}.tools input,button,select{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font:inherit}.filters{display:flex;gap:6px;overflow:auto;margin-top:8px}.filters button.on{background:var(--p);color:#fff}.stats{padding:12px;max-width:1000px;margin:auto}.grid{padding:0 8px 80px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-width:1000px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden}.pic{width:100%;aspect-ratio:476/670;background:#f5eef1;position:relative;overflow:hidden}.pic img{position:absolute;display:block;max-width:none!important;max-height:none!important;object-fit:contain!important}.pic img.landscape-source{width:140.75%!important;height:71.05%!important;left:-20.375%!important;top:14.475%!important;transform:rotate(90deg)!important;transform-origin:center center!important}.pic img.portrait-source{width:100%!important;height:100%!important;left:0!important;top:0!important;transform:none!important}.meta{padding:7px}.row{display:flex;justify-content:space-between;font-weight:700}.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;margin-top:5px}.flags button{padding:6px 1px}.flags button.on{background:var(--p);color:#fff}.qty{display:flex;justify-content:space-between;align-items:center;margin-top:5px}.qty button{padding:4px 10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><h1>アイカツ！カード管理 ♡</h1><div class="tools"><input id="q" placeholder="カード番号で検索"><select id="rare"><option value="">全レア</option><option>PR</option><option>R</option><option>N</option></select></div><div class="filters"><button class="on" data-f="all">すべて</button><button data-f="owned">所持</button><button data-f="missing">未所持</button><button data-f="want">求</button><button data-f="trade">譲</button></div></header><div class="stats" id="stats"></div><main class="grid" id="grid"></main><script>const ns=[...Array(29)].map((_,i)=>i+1).concat([...Array(17)].map((_,i)=>i+33),[...Array(35)].map((_,i)=>i+51));function rare(n){return n<=4||n>=33&&n<=36||n>=51&&n<=52||n>=71&&n<=80?'PR':n>=5&&n<=20||n>=37&&n<=40||n>=53&&n<=59?'R':'N'}const cards=ns.map(n=>{let r=rare(n),num='E1-'+String(n).padStart(2,'0');return{id:num+'_'+r,num,r}}),base='https://dcd.aikatsu.com/encore/images/cardlist/card/',K='aikatsu_state_v1';let state={};try{state=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){}let f='all';const $=s=>document.querySelector(s),st=id=>state[id]||(state[id]={qty:0,want:false,trade:false});function save(){localStorage.setItem(K,JSON.stringify(state))}function orient(im){if(!im.naturalWidth)return;im.classList.add(im.naturalWidth>im.naturalHeight?'landscape-source':'portrait-source')}function draw(){let q=$('#q').value.toUpperCase(),r=$('#rare').value,a=cards.filter(c=>(!q||c.num.includes(q))&&(!r||c.r===r)).filter(c=>{let s=st(c.id);return f==='all'||f==='owned'&&s.qty>0||f==='missing'&&s.qty===0||f==='want'&&s.want||f==='trade'&&s.trade});let own=cards.filter(c=>st(c.id).qty>0).length;$('#stats').textContent='所持 '+own+' / '+cards.length+'　'+(own/cards.length*100).toFixed(1)+'%';$('#grid').innerHTML=a.map(c=>{let s=st(c.id);return `<article class="card"><div class="pic"><img loading="lazy" src="${base+c.id}.webp?v=1802" alt="${c.num}" onload="orient(this)" onerror="this.style.visibility='hidden'"></div><div class="meta"><div class="row"><span>${c.num}</span><small>${c.r}</small></div><div class="flags"><button data-id="${c.id}" data-a="owned" class="${s.qty?'on':''}">所持</button><button data-id="${c.id}" data-a="want" class="${s.want?'on':''}">求</button><button data-id="${c.id}" data-a="trade" class="${s.trade?'on':''}">譲</button></div><div class="qty"><button data-id="${c.id}" data-a="minus">−</button><b>${s.qty||''}</b><button data-id="${c.id}" data-a="plus">＋</button></div></div></article>`}).join('')}$('#grid').onclick=e=>{let b=e.target.closest('[data-id]');if(!b)return;let s=st(b.dataset.id),a=b.dataset.a;if(a==='owned')s.qty=s.qty?0:1;if(a==='want')s.want=!s.want;if(a==='trade')s.trade=!s.trade;if(a==='plus')s.qty++;if(a==='minus')s.qty=Math.max(0,s.qty-1);save();draw()};document.querySelector('.filters').onclick=e=>{let b=e.target.closest('[data-f]');if(!b)return;f=b.dataset.f;document.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));draw()};$('#q').oninput=draw;$('#rare').onchange=draw;draw()</script></body></html>
