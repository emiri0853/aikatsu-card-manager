<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ff78ad"><title>アイカツ！カード管理</title><link rel="stylesheet" href="ui-v15.css"><link rel="stylesheet" href="scanner.css"><style>:root{--pink:#ff78ad;--pink2:#fff0f6;--ink:#302a30;--line:#eadde3;--bg:#fff9fc}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:5;background:#fff9fcf2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:12px}h1{font-size:20px;margin:0 0 10px}.top{max-width:1000px;margin:auto}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px}input,select,button{font:inherit;border:1px solid var(--line);border-radius:12px;background:white;padding:10px}button{cursor:pointer}.primary{background:var(--pink);color:white;border-color:var(--pink);font-weight:700}.tabs{display:flex;gap:6px;overflow:auto;padding-top:8px}.stats{max-width:1000px;margin:12px auto;padding:0 12px;display:flex;gap:10px;align-items:center}.progress{height:10px;background:#eee;border-radius:99px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:var(--pink)}.grid{max-width:1000px;margin:auto;padding:0 12px 90px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}.card>img{width:100%;display:block}.meta{padding:9px}.row,.qty{display:flex;justify-content:space-between;align-items:center}.num{font-weight:800}.rarity{font-size:12px;background:var(--pink2);padding:3px 7px;border-radius:99px}.flags{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.flag{padding:8px 2px}.flag.on{background:var(--pink);color:#fff}.qty{margin-top:8px}.qty button{padding:5px 11px}.empty{grid-column:1/-1;text-align:center;padding:50px;color:#888}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}</style></head><body><header><div class="top"><h1>アイカツ！カード管理</h1><div class="toolbar"><input id="q" placeholder="カード番号で検索"><button class="primary" id="update">↻ 更新</button></div><div class="tabs" id="tabs"><button data-tab="all" class="active">すべて</button><button data-tab="owned">所持</button><button data-tab="missing">未所持</button><button data-tab="want">求</button><button data-tab="trade">譲</button><select id="rarity"><option value="">全レアリティ</option><option>PR</option><option>R</option><option>N</option></select></div></div></header><div class="stats"><b id="count"></b><div class="progress"><i id="bar"></i></div><span id="pct"></span></div><main class="grid" id="grid"></main><script>const nums=[...Array(29)].map((_,i)=>i+1).concat([...Array(17)].map((_,i)=>i+33),[...Array(35)].map((_,i)=>i+51));function rarity(n){if(n<=4||n>=33&&n<=36||n>=51&&n<=52||n>=71&&n<=80)return'PR';if(n>=5&&n<=20||n>=37&&n<=40||n>=53&&n<=59)return'R';return'N'}const INITIAL=nums.map(n=>{const r=rarity(n),number='E1-'+String(n).padStart(2,'0');return{id:number+'_'+r,number,rarity:r,series:'1弾'}}),IMGBASE='https://dcd.aikatsu.com/encore/images/cardlist/card/',KEY_CARDS='aikatsu_cards_v1',KEY_STATE='aikatsu_state_v1';let cards=JSON.parse(localStorage.getItem(KEY_CARDS)||'null')||INITIAL,state=JSON.parse(localStorage.getItem(KEY_STATE)||'{}'),tab='all';localStorage.setItem(KEY_CARDS,JSON.stringify(cards));const $=s=>document.querySelector(s);function st(id){return state[id]||(state[id]={qty:0,want:false,trade:false})}function save(){localStorage.setItem(KEY_STATE,JSON.stringify(state));localStorage.setItem(KEY_CARDS,JSON.stringify(cards))}function render(){const q=$('#q').value.trim().toUpperCase(),rr=$('#rarity').value;let a=cards.filter(c=>(!q||c.number.includes(q))&&(!rr||c.rarity===rr));a=a.filter(c=>{const s=st(c.id);return tab==='all'||tab==='owned'&&s.qty>0||tab==='missing'&&s.qty===0||tab==='want'&&s.want||tab==='trade'&&s.trade});const owned=cards.filter(c=>st(c.id).qty>0).length,p=cards.length?owned/cards.length*100:0;$('#count').textContent=`所持 ${owned} / ${cards.length}`;$('#pct').textContent=p.toFixed(1)+'%';$('#bar').style.width=p+'%';$('#grid').innerHTML=a.length?a.map(c=>{const s=st(c.id);return `<article class="card"><img loading="lazy" src="${IMGBASE+c.id}.webp" alt="${c.number}"><div class="meta"><div class="row"><span class="num">${c.number}</span><span class="rarity">${c.rarity}</span></div><div class="flags"><button class="flag ${s.qty>0?'on':''}" data-id="${c.id}" data-act="owned">所持</button><button class="flag ${s.want?'on':''}" data-id="${c.id}" data-act="want">求</button><button class="flag ${s.trade?'on':''}" data-id="${c.id}" data-act="trade">譲</button></div><div class="qty"><button data-id="${c.id}" data-act="minus">−</button><b>${s.qty}</b><button data-id="${c.id}" data-act="plus">＋</button></div></div></article>`}).join(''):'<div class="empty">該当カードなし</div>'}$('#grid').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;const s=st(b.dataset.id),a=b.dataset.act;if(a==='plus')s.qty++;if(a==='minus')s.qty=Math.max(0,s.qty-1);if(a==='owned')s.qty=s.qty?0:1;if(a==='want')s.want=!s.want;if(a==='trade')s.trade=!s.trade;save();render()};$('#tabs').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('active',x===b));render()};$('#q').oninput=render;$('#rarity').onchange=render;$('#update').onclick=()=>{cards=INITIAL;save();render()};if('serviceWorker'in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));render();</script><script src="ui-v15.js"></script><script src="scanner.js"></script></body></html>
